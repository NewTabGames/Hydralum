name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build MalumMenu
      run: dotnet build MalumMenuPlus/MalumMenu-main/src/MalumMenu.csproj -c Release

    - name: Build HydraMenu
      run: dotnet build Hydra-main/src/HydraMenu.csproj -c Release

    - name: Prepare DLLs Folder
      run: |
        mkdir -p DLLs
        cp MalumMenuPlus/MalumMenu-main/src/bin/Release/net6.0/MalumMenuPlus.dll DLLs/
        cp Hydra-main/src/bin/Release/net6.0/HydraMenu.dll DLLs/

    - name: Upload DLL Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Hydralum-DLLs
        path: DLLs/*.dll
        if-no-files-found: error

    - name: Cache BepInEx Download
      id: cache-bepinex
      uses: actions/cache@v4
      with:
        path: .bepinex_cache
        key: bepinex-785-win-x86

    - name: Download BepInEx (If Not Cached)
      if: steps.cache-bepinex.outputs.cache-hit != 'true'
      run: |
        mkdir -p .bepinex_cache
        curl --http1.1 --retry 5 --retry-delay 3 -L -f -s -S "https://builds.bepinex.dev/projects/bepinex_be/785/BepInEx-Unity.IL2CPP-win-x86-6.0.0-be.785%2B6abdba4.zip" -o .bepinex_cache/bepinex.zip

    - name: Package Standalone Game Folder
      run: |
        mkdir -p standalone_build
        unzip -q .bepinex_cache/bepinex.zip -d standalone_build
        mkdir -p standalone_build/BepInEx/plugins
        mkdir -p standalone_build/BepInEx/config
        cp DLLs/HydraMenu.dll standalone_build/BepInEx/plugins/
        cp DLLs/MalumMenuPlus.dll standalone_build/BepInEx/plugins/
        echo "945360" > standalone_build/steam_appid.txt
        printf "[Logging.Console]\nEnabled = true\nPreventClose = false\nStandardOutType = Auto\nLogLevels = Fatal, Error, Warning, Message, Info\n" > standalone_build/BepInEx/config/BepInEx.cfg

    - name: Upload Standalone Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hydralum-Standalone-Steam
        path: standalone_build/
        if-no-files-found: error

    # The Microsoft Store / Xbox App build of Among Us is 64-bit, so it needs the x64 BepInEx loader
    # (Steam is 32-bit / x86, handled above). The mod DLLs themselves are architecture-agnostic managed
    # assemblies, so the exact same plugins are reused here - only the loader differs.
    - name: Cache BepInEx Download (x64)
      id: cache-bepinex-x64
      uses: actions/cache@v4
      with:
        path: .bepinex_cache_x64
        key: bepinex-785-win-x64

    - name: Download BepInEx x64 (If Not Cached)
      if: steps.cache-bepinex-x64.outputs.cache-hit != 'true'
      run: |
        mkdir -p .bepinex_cache_x64
        curl --http1.1 --retry 5 --retry-delay 3 -L -f -s -S "https://builds.bepinex.dev/projects/bepinex_be/785/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.785%2B6abdba4.zip" -o .bepinex_cache_x64/bepinex.zip

    - name: Package Standalone Game Folder (Microsoft Store / Xbox, x64)
      run: |
        mkdir -p msstore_build
        unzip -q .bepinex_cache_x64/bepinex.zip -d msstore_build
        mkdir -p msstore_build/BepInEx/plugins
        mkdir -p msstore_build/BepInEx/config
        cp DLLs/HydraMenu.dll msstore_build/BepInEx/plugins/
        cp DLLs/MalumMenuPlus.dll msstore_build/BepInEx/plugins/
        # No steam_appid.txt here - that file is Steam-only and unused on Microsoft Store / Xbox.
        printf "[Logging.Console]\nEnabled = true\nPreventClose = false\nStandardOutType = Auto\nLogLevels = Fatal, Error, Warning, Message, Info\n" > msstore_build/BepInEx/config/BepInEx.cfg

    - name: Upload Standalone Artifact (Microsoft Store / Xbox)
      uses: actions/upload-artifact@v4
      with:
        name: Hydralum-Standalone-MicrosoftStore-XboxApp
        path: msstore_build/
        if-no-files-found: error

    - name: Create Release Zip Archives
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cd standalone_build && zip -r ../Hydralum-Standalone-Steam.zip ./* && cd ..
        cd msstore_build && zip -r ../Hydralum-Standalone-MicrosoftStore-XboxApp.zip ./* && cd ..
        cd DLLs && zip -r ../Hydralum-DLLs.zip ./* && cd ..

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Hydralum-Standalone-Steam.zip
          Hydralum-Standalone-MicrosoftStore-XboxApp.zip
          Hydralum-DLLs.zip
        generate_release_notes: true
